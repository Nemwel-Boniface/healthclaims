version: '3.8'

services:
  db:
    image: postgres:15
    container_name: healthclaims_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=healthclaims
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: healthclaims_web
    # REMOVED the "." volume to prevent overwriting the container's /app folder
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/healthclaims
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: